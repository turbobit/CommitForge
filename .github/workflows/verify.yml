name: Verify

env:
  PYTHONUTF8: "1"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify release metadata
        run: python release.py --check

      - name: Verify package
        run: python verify.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: >-
          python -m compileall -q install.py uninstall.py verify.py release.py
          .claude/skills/_git-atomic-core/scripts evals

      - name: Verify checksums
        run: sha256sum -c checksums.sha256

      - name: Smoke test installer
        run: |
          target="$(mktemp -d)"
          ./install.sh project "$target"
          test -f "$target/.claude/skills/cr/SKILL.md"
          test -f "$target/.claude/agents/cca-data-migration-reviewer.md"
          ./install.sh project "$target"
          test -d "$target/.claude/.commitforge-backups"
          ./uninstall.sh project "$target"
          test ! -e "$target/.claude/skills/cr"
          test -d "$target/.claude/.commitforge-uninstall-backups"

  portability:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Verify package
        run: python verify.py

      - name: Run cross-platform tests
        run: python -m unittest discover -s tests -v
